<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Тайна забытого замка</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================
         ФОН
    ====================================== -->

    <div class="background-image"></div>


    <!-- =====================================
         ЭФФЕКТЫ
    ====================================== -->

    <div class="effects">

        <div class="moon"></div>

        <div class="stars">

            <span>✦</span>
            <span>✧</span>
            <span>★</span>
            <span>✦</span>
            <span>✧</span>
            <span>★</span>

        </div>

        <div class="fog"></div>

        <div class="particles">

            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>

        </div>

    </div>


    <!-- =====================================
         СТРАНИЦА ИСТОРИИ
    ====================================== -->

    <main class="story-page">


        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->

        <div class="story-topbar">

            <a href="index.html"
               class="back-story">
                ← В главное меню
            </a>


            <div class="story-counter"
                 id="storyCounter">
                СЦЕНА 1
            </div>

        </div>


        <!-- НАЗВАНИЕ -->

        <h1 class="story-title">
            Тайна забытого замка
        </h1>


        <!-- =====================================
             ОКНО ИСТОРИИ
        ====================================== -->

        <section class="story-box">


            <!-- ИКОНКА -->

            <div class="story-icon"
                 id="storyIcon">
                🏰
            </div>


            <!-- ТЕКСТ -->

            <div class="story-text"
                 id="storyText">
            </div>


            <!-- ВЫБОРЫ -->

            <div class="choices"
                 id="choices">
            </div>


        </section>


        <!-- НАЧАТЬ ЗАНОВО -->

        <button class="restart-btn"
                id="restartBtn">
            ↻ Начать заново
        </button>


    </main>


    <!-- JAVASCRIPT ИСТОРИИ -->

    <script src="story1.js"></script>

</body>

</html>
